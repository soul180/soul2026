name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: 获取 cfnew 最新发布
        id: get_latest
        shell: bash
        run: |
          set -euo pipefail

          curl_retry() {
            local url="$1"
            local attempts="${2:-5}"
            local delay="${3:-3}"
            local i

            for ((i=1; i<=attempts; i++)); do
              local response
              if response=$(curl -fsSL --retry 3 --retry-delay 2 \
                -H "Accept: application/vnd.github+json" \
                -H "User-Agent: GitHubAction" \
                "$url"); then
                printf '%s' "$response"
                return 0
              fi

              if [ "$i" -lt "$attempts" ]; then
                echo "curl 请求失败，等待 ${delay}s 后重试 ($i/$attempts)"
                sleep "$delay"
              fi
            done

            return 1
          }

          echo "正在获取最新发布信息..."
          LATEST_RELEASE_JSON=$(curl_retry "https://api.github.com/repos/byJoey/cfnew/releases/latest" 5 3) || {
            echo "错误：无法获取 cfnew 最新 release 信息"
            exit 1
          }

          if ! echo "$LATEST_RELEASE_JSON" | jq -e '.tag_name and .assets_url' >/dev/null 2>&1; then
            echo "GitHub API 返回异常，未获取到有效的 tag_name 或 assets_url"
            echo "$LATEST_RELEASE_JSON"
            exit 1
          fi

          VERSION=$(echo "$LATEST_RELEASE_JSON" | jq -r '.tag_name // empty')
          ASSETS_URL=$(echo "$LATEST_RELEASE_JSON" | jq -r '.assets_url // empty')

          if [ -z "$VERSION" ] || [ -z "$ASSETS_URL" ]; then
            echo "错误：tag_name 或 assets_url 为空"
            echo "$LATEST_RELEASE_JSON"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "最新版本: $VERSION"

          echo "正在获取文件列表..."
          ASSETS_JSON=$(curl_retry "$ASSETS_URL" 5 3) || {
            echo "错误：无法获取 assets 列表"
            exit 1
          }

          DOWNLOAD_URL=$(echo "$ASSETS_JSON" | jq -r '
            .[]?
            | select((.name // "") | test("Pages.*\\.zip$"; "i"))
            | .browser_download_url
          ' | head -n 1)

          FILE_NAME="Pages.zip"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "错误：未找到 Pages.zip 文件"
            echo "可用文件列表："
            echo "$ASSETS_JSON" | jq -r '.[]?.name // empty' | sed 's/^/  - /'
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "下载 URL: $DOWNLOAD_URL"
          echo "文件名: $FILE_NAME"

      - name: 检查当前版本
        id: check_version
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "VERSION.txt" ]; then
            echo "未找到版本记录文件，创建新文件"
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(tr -d '\r\n ' < VERSION.txt)
            if [ -z "$CURRENT_VERSION" ]; then
              echo "版本记录文件为空，将进行首次更新"
            else
              echo "当前记录的版本: $CURRENT_VERSION"
            fi
          fi

          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            if [ -z "$CURRENT_VERSION" ]; then
              echo "首次运行，将下载文件并创建版本记录"
            else
              echo "发现新版本 $CURRENT_VERSION -> $NEW_VERSION，需要更新"
            fi
            echo "need_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        shell: bash
        run: |
          set -euo pipefail

          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：未找到可下载的文件"
            exit 1
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "错误：未获取到版本号"
            exit 1
          fi

          echo "正在下载文件: $FILE_NAME"
          curl -fsSL -L --retry 3 --retry-delay 2 -o "$FILE_NAME" "$DOWNLOAD_URL" || {
            echo "错误：下载失败"
            exit 1
          }

          if [ ! -f "$FILE_NAME" ]; then
            echo "错误：下载后文件不存在"
            exit 1
          fi

          echo "下载成功: $FILE_NAME"

          echo "正在解压缩 $FILE_NAME..."
          unzip -o "$FILE_NAME" -d . || {
            echo "错误：解压缩失败"
            exit 1
          }

          echo "解压缩成功"

          rm -f "$FILE_NAME"
          echo "已删除压缩文件: $FILE_NAME"

          if [ ! -f "VERSION.txt" ]; then
            echo "创建版本记录文件"
            touch VERSION.txt
          fi

          echo "$VERSION" > VERSION.txt
          echo "版本记录已创建/更新: $VERSION"

          if [ -f "VERSION.txt" ] && [ -s "VERSION.txt" ]; then
            echo "✓ 版本记录文件创建成功"
          else
            echo "✗ 警告：版本记录文件可能未正确创建"
          fi

      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A

          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "已提交并推送更新"
          fi

      - name: 输出摘要
        shell: bash
        run: |
          set -euo pipefail

          echo "## 同步结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- 最新版本: ${{ steps.get_latest.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 当前版本: ${{ steps.check_version.outputs.current_version }}" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "- 状态: ✅ 已更新到新版本" >> "$GITHUB_STEP_SUMMARY"
            echo "- 下载文件: ${{ steps.get_latest.outputs.file_name }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 状态: ⏭️ 版本相同，无需更新" >> "$GITHUB_STEP_SUMMARY"
          fi
